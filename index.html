<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DentiTimer Pro Multi-Mode</title>
    
    <link rel="manifest" href='data:application/json,{"name":"DentiTimer Pro","short_name":"DentiTimer","start_url":".","display":"standalone","background_color":"#f1f5f9","theme_color":"#3b82f6","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3774/3774278.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --btn-inactive: #e2e8f0;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            --ring-bg: #f1f5f9;
        }

        .dark-mode {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-inactive: #1e293b;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --ring-bg: #1e293b;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.4s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 1.2rem env(safe-area-inset-bottom);
        }

        .clinical-card {
            background: var(--card-bg);
            border-radius: 48px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-mode {
            background: var(--btn-inactive);
            border-radius: 16px;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 0.75rem;
        }

        .btn-mode.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .uv-active {
            box-shadow: inset 0 0 60px rgba(99, 102, 241, 0.15);
        }

        .waiting-bg {
            background-color: rgba(59, 130, 246, 0.1) !important;
        }

        #themeToggle {
            background: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <div class="main-container w-full max-w-md py-4">
        
        <!-- App Header con Toggle de Modo -->
        <div class="flex justify-between items-center mb-6 px-2">
            <div>
                <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Dentoestetica</p>
                <h1 class="text-3xl font-800 tracking-tighter">DentiTimer <span class="font-light text-blue-500">Pro</span></h1>
            </div>
            <button id="themeToggle" onclick="toggleTheme()" class="p-3 rounded-2xl transition-all active:scale-90">
                <span id="themeIcon" class="text-xl">🌙</span>
            </button>
        </div>

        <!-- Mode Selectors -->
        <div class="grid grid-cols-3 gap-2 mb-2">
            <button onclick="setMode('auto')" id="tab-auto" class="btn-mode py-4 uppercase">Auto</button>
            <button onclick="setMode('selectivo')" id="tab-selectivo" class="btn-mode py-4 uppercase">Selectivo</button>
            <button onclick="setMode('total')" id="tab-total" class="btn-mode py-4 uppercase">Total</button>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-6">
            <button onclick="setMode('disilicato')" id="tab-disilicato" class="btn-mode py-4 uppercase">Disilicato</button>
            <button onclick="setMode('feldespatica')" id="tab-feldespatica" class="btn-mode py-4 uppercase">Feldespática</button>
        </div>

        <!-- Main Workspace -->
        <div id="mainCard" class="clinical-card flex-1 flex flex-col items-center justify-between p-8 relative overflow-hidden transition-all duration-500">
            
            <div id="statusText" class="text-blue-500 text-[11px] font-bold uppercase tracking-[0.25em]">Listo</div>

            <!-- Progress Circle -->
            <div class="relative flex items-center justify-center w-full max-w-[260px] aspect-square">
                <svg class="transform -rotate-90 w-full h-full">
                    <circle cx="50%" cy="50%" r="44%" stroke="var(--ring-bg)" stroke-width="10" fill="transparent" />
                    <circle id="progressCircle" cx="50%" cy="50%" r="44%" stroke="currentColor" stroke-width="14" fill="transparent"
                            stroke-dasharray="1000" stroke-dashoffset="1000"
                            class="text-blue-500 transition-all duration-300" stroke-linecap="round"/>
                </svg>
                <div id="timerDisplay" class="absolute text-8xl font-semibold tabular-nums">00</div>
            </div>

            <!-- Control Action -->
            <button id="startBtn" onclick="startSequence()" class="w-full py-5 bg-blue-600 text-white rounded-3xl font-bold uppercase tracking-widest text-xs active:scale-95 transition-all shadow-xl shadow-blue-200">
                Iniciar Secuencia
            </button>

            <!-- Bottom Progress -->
            <div class="w-full">
                <div id="timeline" class="flex w-full h-2 bg-slate-200 rounded-full overflow-hidden mb-3"></div>
                <div id="stepLabel" class="text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest h-4">---</div>
            </div>
        </div>

        <button onclick="resetAll()" class="mt-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest py-2">Reiniciar Aplicación</button>
    </div>

    <script>
        let countdown;
        let isRunning = false;
        let isDarkMode = false;
        let currentSequence = [];
        let currentStepIndex = 0;
        const circle = document.getElementById('progressCircle');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Alternar Temas
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const btn = document.getElementById('startBtn');

            if (isDarkMode) {
                body.classList.add('dark-mode');
                icon.innerText = '☀️';
                btn.classList.remove('shadow-blue-200');
                btn.classList.add('shadow-slate-900');
            } else {
                body.classList.remove('dark-mode');
                icon.innerText = '🌙';
                btn.classList.add('shadow-blue-200');
                btn.classList.remove('shadow-slate-900');
            }
        }

        // Motor de Sonido
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'wait') {
                osc.frequency.setValueAtTime(330, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'start') {
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'end') {
                [800, 1200].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime + (i*0.1));
                    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (i*0.1) + 0.4);
                    o.start(audioCtx.currentTime + (i*0.1)); o.stop(audioCtx.currentTime + (i*0.1) + 0.4);
                });
            }
        }

        const protocols = {
            auto: [{l:"Adhesivo", t:20, c:"#f59e0b"}, {l:"Aire", t:5, c:"#64748b"}, {l:"Luz UV", t:10, uv:true, c:"#6366f1"}],
            selectivo: [{l:"Grabado Esmalte", t:15, c:"#ef4444"}, {l:"Lavar/Secar", t:15, c:"#3b82f6"}, {l:"Adhesivo", t:20, c:"#f59e0b"}, {l:"Luz UV", t:10, uv:true, c:"#6366f1"}],
            total: [{l:"Grabado Total", t:15, c:"#ef4444"}, {l:"Lavar/Secar", t:15, c:"#3b82f6"}, {l:"Adhesivo", t:20, c:"#f59e0b"}, {l:"Luz UV", t:10, uv:true, c:"#6366f1"}],
            disilicato: [{l:"HF 5%", t:20, c:"#ef4444"}, {l:"Lavar", t:20, c:"#3b82f6"}, {l:"Secado Aire", t:10, c:"#94a3b8"}, {l:"Silano", t:60, c:"#10b981"}, {l:"Adhesivo", t:10, c:"#f59e0b"}],
            feldespatica: [{l:"HF 9%", t:60, c:"#ef4444"}, {l:"Lavar", t:20, c:"#3b82f6"}, {l:"Secado Aire", t:10, c:"#94a3b8"}, {l:"Silano", t:60, c:"#10b981"}, {l:"Adhesivo", t:10, c:"#f59e0b"}]
        };

        function setMode(mode) {
            if(isRunning) return;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            currentSequence = protocols[mode];
            currentStepIndex = 0;
            resetVisuals();
            buildTimeline();
        }

        function resetVisuals() {
            document.getElementById('timerDisplay').innerText = "00";
            document.getElementById('statusText').innerText = "Listo";
            document.getElementById('statusText').style.color = "#3b82f6";
            document.getElementById('stepLabel').innerText = "---";
            circle.style.strokeDashoffset = 1000;
            circle.style.color = "#3b82f6";
            document.getElementById('mainCard').classList.remove('waiting-bg', 'uv-active');
            document.getElementById('startBtn').classList.remove('hidden');
        }

        function buildTimeline() {
            const tl = document.getElementById('timeline');
            tl.innerHTML = '';
            currentSequence.forEach((step, i) => {
                const seg = document.createElement('div');
                seg.id = `seg-${i}`;
                seg.className = 'h-full flex-1 transition-colors duration-500 bg-slate-300 border-r border-white/20';
                tl.appendChild(seg);
            });
        }

        function startSequence() {
            if(isRunning) return;
            audioCtx.resume();
            isRunning = true;
            document.getElementById('startBtn').classList.add('hidden');
            runStep();
        }

        async function runStep() {
            if (currentStepIndex >= currentSequence.length) {
                finish(); return;
            }
            if (currentStepIndex > 0) await waitPeriod();

            const step = currentSequence[currentStepIndex];
            updateTimeline();
            playSound('start');
            
            runTimer(step.t, step.l, step.uv, step.c, () => {
                currentStepIndex++;
                runStep();
            });
        }

        function waitPeriod() {
            return new Promise(resolve => {
                let waitTime = 3;
                const display = document.getElementById('timerDisplay');
                const status = document.getElementById('statusText');
                const card = document.getElementById('mainCard');
                
                card.classList.add('waiting-bg');
                status.innerText = "Siguiente Etapa...";
                status.style.color = "#3b82f6";
                circle.style.color = isDarkMode ? "#1e293b" : "#cbd5e1";
                
                const interval = setInterval(() => {
                    display.innerText = `0${waitTime}`;
                    playSound('wait');
                    waitTime--;
                    if(waitTime < 0) {
                        clearInterval(interval);
                        card.classList.remove('waiting-bg');
                        resolve();
                    }
                }, 1000);
            });
        }

        function runTimer(sec, label, uv, color, callback) {
            const display = document.getElementById('timerDisplay');
            const status = document.getElementById('statusText');
            const card = document.getElementById('mainCard');
            
            status.innerText = label;
            status.style.color = color;
            circle.style.color = color;
            document.getElementById('stepLabel').innerText = label;
            if(uv) card.classList.add('uv-active'); else card.classList.remove('uv-active');

            let time = sec;
            display.innerText = time < 10 ? `0${time}` : time;

            circle.style.transition = 'none';
            circle.style.strokeDashoffset = 1000;
            setTimeout(() => {
                circle.style.transition = `stroke-dashoffset ${sec}s linear`;
                circle.style.strokeDashoffset = 0;
            }, 50);

            countdown = setInterval(() => {
                time--;
                display.innerText = time < 10 ? `0${time}` : time;
                if(time <= 0) {
                    clearInterval(countdown);
                    playSound('start');
                    callback();
                }
            }, 1000);
        }

        function updateTimeline() {
            currentSequence.forEach((_, i) => {
                const seg = document.getElementById(`seg-${i}`);
                if(i < currentStepIndex) seg.style.backgroundColor = currentSequence[i].c;
                else if(i === currentStepIndex) seg.style.backgroundColor = isDarkMode ? '#fff' : '#1e293b';
            });
        }

        function finish() {
            isRunning = false;
            playSound('end');
            document.getElementById('statusText').innerText = "Completado";
            document.getElementById('statusText').style.color = "#10b981";
            document.getElementById('startBtn').innerText = "Nuevo Protocolo";
            document.getElementById('startBtn').classList.remove('hidden');
        }

        function resetAll() { location.reload(); }

        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(()=>{});
        }

        setMode('disilicato');
    </script>
</body>
</html>
